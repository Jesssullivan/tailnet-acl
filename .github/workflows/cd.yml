name: CD

on:
  push:
    branches: [main]

concurrency:
  group: acl-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, validate, push ACL
    if: github.repository_id == '1165961732' && github.repository_owner_id == '37297218'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TS_FEDERATED_CLIENT_ID: ${{ vars.TS_POLICY_WRITER_CLIENT_ID }}
      TS_FEDERATED_AUDIENCE: ${{ vars.TS_POLICY_WRITER_AUDIENCE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted context before installing tools or requesting a token
        run: python3 scripts/policy_ci.py writer --check-context

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Apply from verified source baseline with the writer identity
        run: nix develop --no-write-lock-file --command python3 scripts/policy_ci.py writer
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/trusted-policy-cache
